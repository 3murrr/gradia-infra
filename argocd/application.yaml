apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gradia
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/3murrr/gradia-infra.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: gradia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

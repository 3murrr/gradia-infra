apiVersion: v1
kind: Service
metadata:
  name: results
  namespace: gradia
  labels: {app: results}
spec:
  selector: {app: results}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: results
  namespace: gradia
  labels: {app: results}
spec:
  selector:
    matchLabels: {app: results}
  template:
    metadata:
      labels: {app: results}
    spec:
      enableServiceLinks: false
      containers:
        - name: results
          image: gradia-results:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: REDIS_HOST
              value: redis
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: gradia-secrets, key: DB_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: gradia-secrets, key: JWT_SECRET}
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
